# =============================================================================
# Xaloqi EDS
# boards/frdm_mcxn947/frdm_mcxn947_zephyr45.conf
#
# Added on top of frdm_mcxn947.conf for a build on Zephyr 4.4 or newer (the
# board exception to the v3.7 pin, products/eds-zephyr-version-policy.md in the
# knowledge base). Use it with frdm_mcxn947_zephyr45.overlay.
#
#  CONFIG_ENTROPY_GENERATOR=y
#    From Zephyr 4.4 the MCX N94x has a TRNG driver (nxp,els-trng, the ELS
#    subsystem). On the pinned v3.7.0 it has none, so frdm_mcxn947.conf leaves
#    ENTROPY_GENERATOR unset and SecurityAccess seeds come from the 16-bit
#    LFSR (development only; EDS#670). With the TRNG, 0x27 seeds are
#    unpredictable and a production build (fail-closed entropy) can issue them.
#    The overlay makes the TRNG the zephyr,entropy device: the secure
#    frdm_mcxn947/mcxn947/cpu0 board target does not, in v4.4 or v4.5 (only
#    the _ns target names it, and disables it).
# =============================================================================

CONFIG_ENTROPY_GENERATOR=y
