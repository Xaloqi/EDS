# CI fixture of .github/workflows/zephyr-main-weekly.yml: examples/basic_ecu_doip as a Xen guest
# (Zephyr's `xenvm` board, SoDeV's DomZ), reached over virtio-net. Build-only; nothing boots it.
# Same shape as the xenvm variant of Xaloqi/Zephyr-Reference-ECU (boards/xenvm_doip.conf), minus
# the RAM-backed flash (this build uses the mock NVM backend). Not a supported EDS board file.

# SDK 1.0.x ships no newlib; the weekly script also passes NEWLIB_LIBC=n / EDS_REQUIRE_NEWLIB=n.
# Stack canaries: a xenvm guest's only entropy source is virtio-rng, which is not available when
# the canary is seeded, so EDS#500's guard refuses them. prj.conf's canary lines are dropped for
# this build (@PRJ_NO_CANARIES@: on Zephyr 4.4+ a later =n does not undo an earlier =y, EDS#501).
CONFIG_STACK_CANARIES=n
CONFIG_EDS_REQUIRE_STACK_CANARIES=n
CONFIG_WATCHDOG=n
CONFIG_ENTROPY_GENERATOR=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DRIVERS=y
CONFIG_NET_LOOPBACK=n
CONFIG_NET_SHELL=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"

# Zephyr's virtio_mmio / virtqueue allocate from the kernel heap at init.
CONFIG_HEAP_MEM_POOL_SIZE=65536

CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_PRINTK=n
