# [EDS#197] basic_ecu_doip -DDIAG_DOIP_SELFTEST=... on native_sim only.
# A real watchdog on native_sim: Zephyr's counter watchdog on the board's
# counter (selftest_wdt.overlay), so a stalled executor is seen to trip it.
# Overrides native_sim_doip.conf's CONFIG_WATCHDOG=n.
CONFIG_WATCHDOG=y
CONFIG_WDT_COUNTER=y
CONFIG_COUNTER=y
# The verdict is printk'd straight to the console, not through the deferred
# log, so it is out before posix_exit().
CONFIG_LOG_PRINTK=n
# Both ends of the TCP connection live in this image (loopback) and share
# the packet pools; the example's 4 TX packets leave the server no packet
# for its SYN-ACK while the client's SYN waits for retransmission.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
