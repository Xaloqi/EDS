CONFIG_ZTEST=y
CONFIG_LOG=y
CONFIG_OTP=y
CONFIG_OTP_PROGRAM=y
# The default key source is placeholder; the test needs OTP. Build with
# -DCONFIG_EDS_KEYS_PLACEHOLDER=y to see the test fail as safeboot_ecu did before #56.
CONFIG_EDS_KEYS_OTP=y
# Layout used by the test and by the README's example: level 0x01 key at byte 0,
# level 0x03 key at byte 16.
CONFIG_EDS_KEYS_OTP_L1_OFFSET=0
CONFIG_EDS_KEYS_OTP_L2_OFFSET=16
