# examples/safeboot_ecu/boards/nucleo_h743zi/nucleo_h743zi.conf
#
# STM32H743ZI board config for SafeBootECU — extends base nucleo conf.
# Adds MCUboot bootloader requirements on top of the standard board config.

# --- From base nucleo config (required for this board) ---
CONFIG_SERIAL=y
CONFIG_UART_STM32=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n
CONFIG_ARM_MPU=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_STACK_SENTINEL=n
CONFIG_STACK_CANARIES=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_LOG_BUFFER_SIZE=4096

# --- Flash map (required by zephyr_flash_ops.c and nvm_store.c) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
# CONFIG_FLASH_MAP_LABELS gates the FLASH_AREA_ID(label)/label-lookup
# convenience macros in zephyr/storage/flash_map.h separately from
# CONFIG_FLASH_MAP itself (which only builds the flash_area subsystem
# core). Without this, FLASH_AREA_ID() is never #define'd at all --
# zephyr_flash_ops.c's own #ifndef FLASH_AREA_ID / #error guard exists
# for exactly this case, but its message ("ensure CONFIG_FLASH_MAP=y in
# prj.conf") doesn't mention this second symbol. Found via CI #291,
# the first time this file was actually compiled: flash_map.h's own
# `#if CONFIG_FLASH_MAP_LABELS` guards (around its FLASH_AREA_ID
# definition) triggered -Wundef, evaluating to 0/unset.
CONFIG_FLASH_MAP_LABELS=y
CONFIG_NVS=y

# --- MCUboot secondary slot write support ---
# flash_area_write() requires this to allow writes to non-erase-aligned offsets.
# Zephyr 3.7: STM32H743 flash requires 256-bit (32-byte) aligned writes.
# CONFIG_FLASH_PAGE_LAYOUT=y is auto-selected with CONFIG_FLASH=y on STM32.
CONFIG_FLASH_PAGE_LAYOUT=y

# --- MCUboot image manager (boot_write_img_confirmed, boot_is_img_confirmed) ---
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y
