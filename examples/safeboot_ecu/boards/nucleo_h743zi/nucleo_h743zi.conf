# examples/safeboot_ecu/boards/nucleo_h743zi/nucleo_h743zi.conf
#
# STM32H743ZI board config for SafeBootECU — extends base nucleo conf.
# Adds MCUboot bootloader requirements on top of the standard board config.

# --- From base nucleo config (required for this board) ---
CONFIG_SERIAL=y
CONFIG_UART_STM32=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n
CONFIG_ARM_MPU=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_STACK_SENTINEL=n
CONFIG_STACK_CANARIES=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_LOG_BUFFER_SIZE=4096

# --- Flash map (required by zephyr_flash_ops.c and nvm_store.c) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# --- MCUboot image confirmation (required by main.c's boot_is_img_confirmed()/
# boot_write_img_confirmed() calls, right after uds_generated_init() -- see
# that call site's own comment, which already documented CONFIG_BOOTLOADER_
# MCUBOOT/CONFIG_MCUBOOT_IMG_MANAGER as required). Those two symbols were
# already set (further down, in the "MCUboot image manager" block this
# replaces) -- CONFIG_STREAM_FLASH/CONFIG_IMG_MANAGER were the actually
# missing ones. Consolidated all four into one place: /code-review caught
# that mid-investigation I'd re-added CONFIG_BOOTLOADER_MCUBOOT/
# CONFIG_MCUBOOT_IMG_MANAGER a second time up here without noticing they
# already existed below, which is exactly the kind of duplicate-assignment
# maintenance hazard worth fixing rather than leaving in place just because
# Kconfig tolerates a redundant identical assignment silently.
#
# The full dependency chain (confirmed against the actual
# subsys/dfu/Kconfig source, v3.7.0):
#   menuconfig IMG_MANAGER          depends on STREAM_FLASH
#     choice "Image manager"        default MCUBOOT_IMG_MANAGER
#       MCUBOOT_IMG_MANAGER         depends on FLASH_MAP (already set above)
#                                   select MCUBOOT_BOOTUTIL_LIB (provides
#                                   boot_is_img_confirmed()/
#                                   boot_write_img_confirmed())
# CONFIG_STREAM_FLASH was the actual missing link: without it, the whole
# IMG_MANAGER menuconfig is invisible, so nothing inside it -- including
# an explicit CONFIG_MCUBOOT_IMG_MANAGER=y assignment -- can ever take
# effect, no matter what else is set. This is exactly what Kconfig's own
# trace was reporting before this fix: "choice symbol MCUBOOT_IMG_MANAGER
# ... was selected (set=y), but no symbol ended up as the choice
# selection" -- the assignment was always being silently dropped by the
# unentered outer menu.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# --- MCUboot secondary slot write support ---
# flash_area_write() requires this to allow writes to non-erase-aligned offsets.
# Zephyr 3.7: STM32H743 flash requires 256-bit (32-byte) aligned writes.
# CONFIG_FLASH_PAGE_LAYOUT=y is auto-selected with CONFIG_FLASH=y on STM32.
CONFIG_FLASH_PAGE_LAYOUT=y
