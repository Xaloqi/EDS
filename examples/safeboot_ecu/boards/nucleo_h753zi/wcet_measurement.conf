# =============================================================================
# Xaloqi EDS
# examples/safeboot_ecu/boards/nucleo_h753zi/wcet_measurement.conf
#
# PURPOSE: Issue #31 WCET measurement campaign — enables Zephyr's DWT-backed
# timing_* API. Use together with -DEXTRA_CFLAGS=-DDIAG_WCET_MEASURE=1 (the
# preprocessor flag that actually activates the instrumentation — see
# platform/zephyr/zephyr_wcet.h). This conf alone does nothing without that
# flag; the flag alone does nothing without CONFIG_TIMING_FUNCTIONS=y here.
# Not referenced by the normal board build — additive, opt-in only.
# =============================================================================

CONFIG_TIMING_FUNCTIONS=y

# k_thread_stack_space_get() (runtime high-water-mark, cross-checking the
# static -fstack-usage estimate) requires stack-painting to be enabled.
CONFIG_INIT_STACKS=y
