# examples/safeboot_ecu/boards/mr_canhubk3_s32k344_mcuboot/sysbuild.conf
#
# Pass with -DSB_CONF_FILE=<this file>. Zephyr's MCUboot variant of the board
# defaults to direct-XIP (boards/nxp/mr_canhubk3/Kconfig.sysbuild). SafeBootECU
# arms an update with boot_request_upgrade() and checks the download size and
# anti-rollback against a swap (platform/zephyr/zephyr_mcuboot_image_policy.c,
# zephyr_flash_ops.c), so this build uses swap-using-move, as the NUCLEO does.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
