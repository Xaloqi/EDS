# examples/safeboot_ecu/boards/mr_canhubk3_s32k344_mcuboot/mr_canhubk3_s32k344_mcuboot.conf
#
# SafeBootECU on the NXP MR-CANHUBK3 (S32K344), MCUboot variant of the board
# (mr_canhubk3/s32k344/mcuboot, Zephyr v4.4.0 and later). Build with sysbuild;
# see this directory's sysbuild.conf and the command in the example README.
#
# Layered after boards/mr_canhubk3/mr_canhubk3.conf (CAN, console, watchdog,
# MPU, NVS): pass both in EXTRA_CONF_FILE, that one first. The devicetree
# overlay is boards/mr_canhubk3/mr_canhubk3.overlay, whose flash map is the
# MCUboot variant's own plus diag_nvs.

# --- MCUboot image confirmation and the image manager ------------------------
# Same four symbols as the NUCLEO board config; see the dependency chain
# explained in boards/nucleo_h753zi/nucleo_h753zi.conf.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# --- EDS_MCUBOOT_MAX_IMG_SECTORS (platform/zephyr/zephyr_flash_ops.c, #436) ---
# MCUboot sizes its trailer from the layout here (BOOT_MAX_IMG_SECTORS_AUTO:
# 1920 KiB / 8 KiB = 240 sectors); EDS assumes MCUboot's old default, 128.
# Both trailers fit in one 8 KiB sector, so the download capacity 0x34
# advertises is the same, 0x1DC000 bytes. Define EDS_MCUBOOT_MAX_IMG_SECTORS
# if the slots or the sector size change.
