# robot_joint_controller_ecu — native_sim, host-reachable CAN (SocketCAN)
#
# native_sim.conf without CONFIG_CAN_LOOPBACK, for use with
# native_sim_socketcan.overlay (can0 -> host interface zcan0). See the README.
CONFIG_NVS=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_WATCHDOG=n

# [O-132] Required for zephyr_port_ecu_reset() / sys_reboot() — without it
# the link fails with "undefined reference to sys_reboot".
CONFIG_REBOOT=y
