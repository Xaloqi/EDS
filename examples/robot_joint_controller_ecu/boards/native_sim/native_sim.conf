# robot_joint_controller_ecu — native_sim overrides
# (loopback variant: nothing outside the process can reach it. For a tester
#  on the host use native_sim_socketcan.conf + .overlay instead.)
CONFIG_NVS=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_CAN_LOOPBACK=y
CONFIG_WATCHDOG=n

# [O-132] Required for zephyr_port_ecu_reset() / sys_reboot() — without it
# the link fails with "undefined reference to sys_reboot".
CONFIG_REBOOT=y
