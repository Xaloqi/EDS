# =============================================================================
# Xaloqi EDS
# examples/motor_controller_ecu/boards/native_sim/native_sim.conf
#
# native_sim board-specific Kconfig overrides for the motor controller
# example. [EDS#343] Header path and a missing CONFIG_WATCHDOG=n fixed —
# this file was a copy-pasted bms_ecu conf never adapted for this example;
# the missing watchdog override made `west build -b native_sim
# examples/motor_controller_ecu` (this example's own documented invocation)
# fail outright with "CONFIG_WATCHDOG=y but this board's devicetree exposes
# no watchdog". basic_ecu's equivalent root-level conf already carries this
# exact override with the same rationale.
#
# This file is included in addition to prj.conf when building for native_sim.
# It enables the CAN loopback driver and suppresses hardware-specific
# Kconfig options that are not available on the simulation target.
# =============================================================================

# Enable the software CAN loopback driver (no real CAN hardware needed)
CONFIG_CAN_LOOPBACK=y

# Disable stack canaries on native_sim: depends on ENTROPY_GENERATOR which
# is not present on native_sim. Hardware stack protection is not relevant here.
CONFIG_STACK_CANARIES=n

# [EDS#343] native_sim has no watchdog device; CONFIG_WATCHDOG=y (prj.conf's
# default) fails the build with a BUILD_ASSERT in zephyr_wdt.c otherwise.
CONFIG_WATCHDOG=n
