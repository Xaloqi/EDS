# Xaloqi EDS
# examples/basic_ecu_doip/boards/mr_canhubk3/mr_canhubk3_doip.conf
#
# PURPOSE: BasicECU_DoIP on the NXP MR-CANHUBK3 (S32K344). Build-only in CI;
#          not run on the board yet.
#
# The board's devicetree already enables the S32K344 Ethernet MAC and its
# NXP TJA1103 PHY (100BASE-T1, MDIO address 0x12). This file only adds the
# application-level network settings, as the NUCLEO-H753ZI DoIP conf does.
#
# HOST-SIDE SETUP: 100BASE-T1 is automotive single-pair Ethernet. A PC NIC
# cannot connect to it directly; it needs a 100BASE-T1 to 100BASE-TX media
# converter. Then give the host a static IP on the same /24 (10.10.10.2/24).
#
# BUILDING (from the workspace, EDS checked out as EDS/):
#   west build -b mr_canhubk3 EDS/examples/basic_ecu_doip -- \
#       -DDIAG_SKIP_CODEGEN=ON -DDIAG_USE_MOCK_NVM=ON \
#       "-DEXTRA_CONF_FILE=$PWD/EDS/boards/mr_canhubk3/mr_canhubk3.conf;$PWD/EDS/examples/basic_ecu_doip/boards/mr_canhubk3/mr_canhubk3_doip.conf" \
#       -DDTC_OVERLAY_FILE=$PWD/EDS/boards/mr_canhubk3/mr_canhubk3.overlay
#   -DDIAG_USE_MOCK_NVM=ON: this example passes no NVS partition to
#   nvm_store_init() on any real board (see src/main.c), as on the NUCLEO.
# =============================================================================

CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.10.10.1"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.10.10.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# --- Random numbers for TCP: TEST GENERATOR, NOT FOR PRODUCTION --------------
# TCP needs sys_rand_get() (initial sequence numbers). The S32K344's random
# source is in its HSE security engine, and neither Zephyr v3.7.0 nor v4.4.x
# has an entropy driver for it, so without this the link fails with
# "undefined reference to z_impl_sys_rand_get". The test generator makes TCP
# sequence numbers predictable. That is acceptable on a bench link and not in
# a product: a product must supply a real entropy driver. EDS's own
# SecurityAccess seeds do not come from here (see uds_security_algo_set_rng_cb
# in src/main.c and docs/SECURITY_NOTICE.md).
CONFIG_TEST_RANDOM_GENERATOR=y
