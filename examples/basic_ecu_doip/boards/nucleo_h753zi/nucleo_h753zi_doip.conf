# =============================================================================
# Xaloqi EDS
# examples/basic_ecu_doip/boards/nucleo_h753zi/nucleo_h753zi_doip.conf
#
# PURPOSE: Real-hardware DoIP bring-up for issue #31 (WCET analysis) — the
#          DoIP forwarding path had no hardware board config at all before
#          this; only native_sim (loopback or the host-bridged "realzeth"
#          variant) existed.
#
# NUCLEO-H753ZI's Zephyr board support already wires the STM32 Ethernet MAC
# and PHY in devicetree with status "okay" (RMII pinctrl, MDIO) — nothing to
# add there. CONFIG_ETH_STM32_HAL defaults to y once DT_HAS_ST_STM32_ETHERNET
# _ENABLED is true (drivers/ethernet/Kconfig.stm32_hal), which it is on this
# board out of the box. This file only needs the application-level net stack
# config: enable the L2 Ethernet driver and set a static IPv4 address for a
# direct point-to-point bench link (no DHCP server on that link).
#
# HOST-SIDE SETUP THIS CONF EXPECTS: a direct Ethernet cable from this board
# to the host machine's own NIC, with the host given a static IP on the same
# /24 (e.g. `sudo ip addr add 10.10.10.2/24 dev <host-iface>`) — no router,
# no DHCP server. Not net-tools/zeth (that's the native_sim-only bridge
# pattern in native_sim_doip_realzeth.conf); this is real hardware talking
# directly to a real NIC.
#
# BUILDING (real flash storage, EDS#408):
#   west build -b nucleo_h753zi examples/basic_ecu_doip -- \
#       -DDIAG_SKIP_CODEGEN=ON \
#       -DEXTRA_CONF_FILE=examples/basic_ecu_doip/boards/nucleo_h753zi/nucleo_h753zi_doip.conf \
#       -DDTC_OVERLAY_FILE=boards/nucleo_h753zi/nucleo_h753zi.overlay \
#       -DEXTRA_DTC_OVERLAY_FILE=examples/basic_ecu_doip/boards/nucleo_h753zi/nucleo_h753zi_doip.overlay
#   boards/nucleo_h753zi/nucleo_h753zi.overlay carries the flash layout with the
#   diag_nvs partition (256 KB at 0x1C0000); the append backend uses it as two
#   128 KB banks. The doip overlay adds the watchdog alias and is also needed.
#
# BUILDING (RAM-backed DTC mirror, no partition needed):
#   as above without DTC_OVERLAY_FILE, and with -DDIAG_USE_MOCK_NVM=ON. The DTC
#   mirror then does not survive a reset (EDS#403).
# =============================================================================

# --- Real Ethernet driver (auto-selected once NET_L2_ETHERNET is on; set
#     explicitly for the same reason native_sim_doip_realzeth.conf does) ---
CONFIG_NET_L2_ETHERNET=y

# --- Static IPv4 — point-to-point bench link, no DHCP server present ---
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.10.10.1"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.10.10.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# --- Real hardware: keep console/log on the ST-LINK VCP (board default via
#     zephyr,console = &usart3), do NOT disable stack canaries or the
#     watchdog the way native_sim's conf does for simulator-only reasons ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- Stack canaries (requested in prj.conf) ---------------------------------
# Seeded in z_cstart() from the STM32 RNG (zephyr,entropy = &rng, enabled in
# the board DTS). NETWORKING already selects ENTROPY_GENERATOR; set it here
# too so the canaries do not depend on that.
CONFIG_ENTROPY_GENERATOR=y

# --- Watchdog [EDS#399]: armed by src/main.c, NOT by Zephyr at boot -------
# IWDG via the board's watchdog0 alias; window CONFIG_DIAG_WDT_WINDOW_MS
# (100 ms default). Boot-time arming must stay off: Zephyr's IWDG driver
# would otherwise arm it in iwdg_stm32_init(), before main(), with a 100 ms
# timeout, while net_config_init() also runs before main() and blocks until
# the interface is up (measured 1.5-4.1 s on this board in
# Zephyr-Reference-ECU#7, which is how that board reset every ~100 ms
# forever). src/main.c arms it explicitly; see its WATCHDOG SUPERVISION
# comment for exactly what is and is not covered.
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=y

# --- Real flash storage [EDS#408]: the append backend on diag_nvs ------------
# NVS cannot mount STM32H7's 128 KB sectors (EDS#504). The backend programs
# flash from the application, which the MPU must allow. Same four options as
# boards/nucleo_h753zi/nucleo_h753zi.conf; unused by a DIAG_USE_MOCK_NVM build.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ARM_MPU=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
