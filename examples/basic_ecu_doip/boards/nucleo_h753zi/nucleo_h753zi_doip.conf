# =============================================================================
# Xaloqi EDS
# examples/basic_ecu_doip/boards/nucleo_h753zi/nucleo_h753zi_doip.conf
#
# PURPOSE: Real-hardware DoIP bring-up for issue #31 (WCET analysis) — the
#          DoIP forwarding path had no hardware board config at all before
#          this; only native_sim (loopback or the host-bridged "realzeth"
#          variant) existed.
#
# NUCLEO-H753ZI's Zephyr board support already wires the STM32 Ethernet MAC
# and PHY in devicetree with status "okay" (RMII pinctrl, MDIO) — nothing to
# add there. CONFIG_ETH_STM32_HAL defaults to y once DT_HAS_ST_STM32_ETHERNET
# _ENABLED is true (drivers/ethernet/Kconfig.stm32_hal), which it is on this
# board out of the box. This file only needs the application-level net stack
# config: enable the L2 Ethernet driver and set a static IPv4 address for a
# direct point-to-point bench link (no DHCP server on that link).
#
# HOST-SIDE SETUP THIS CONF EXPECTS: a direct Ethernet cable from this board
# to the host machine's own NIC, with the host given a static IP on the same
# /24 (e.g. `sudo ip addr add 10.10.10.2/24 dev <host-iface>`) — no router,
# no DHCP server. Not net-tools/zeth (that's the native_sim-only bridge
# pattern in native_sim_doip_realzeth.conf); this is real hardware talking
# directly to a real NIC.
#
# BUILDING:
#   west build -b nucleo_h753zi examples/basic_ecu_doip -- \
#       -DDIAG_SKIP_CODEGEN=ON \
#       -DEXTRA_CONF_FILE=examples/basic_ecu_doip/boards/nucleo_h753zi/nucleo_h753zi_doip.conf
# =============================================================================

# --- Real Ethernet driver (auto-selected once NET_L2_ETHERNET is on; set
#     explicitly for the same reason native_sim_doip_realzeth.conf does) ---
CONFIG_NET_L2_ETHERNET=y

# --- Static IPv4 — point-to-point bench link, no DHCP server present ---
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.10.10.1"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.10.10.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# --- Real hardware: keep console/log on the ST-LINK VCP (board default via
#     zephyr,console = &usart3), do NOT disable stack canaries or the
#     watchdog the way native_sim's conf does for simulator-only reasons ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
