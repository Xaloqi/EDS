# =============================================================================
# Xaloqi EDS
# examples/basic_ecu_doip/boards/frdm_mcxn947/frdm_mcxn947_doip.conf
#
# PURPOSE: DoIP over the FRDM-MCXN947's on-board Ethernet (LAN8741A PHY, ENET
#          QoS, RMII, 10/100) with the NVM store on real flash [EDS#408]. Same
#          static point-to-point setup as nucleo_h753zi_doip.conf: a direct
#          cable to the host, host given 10.10.10.2/24, no DHCP.
#
# BUILDING (Zephyr v3.7.0, MCX N947 is NXP industrial silicon):
#   west build -b frdm_mcxn947/mcxn947/cpu0 examples/basic_ecu_doip -- \
#       -DDIAG_SKIP_CODEGEN=ON \
#       "-DEXTRA_CONF_FILE=boards/frdm_mcxn947/frdm_mcxn947.conf;examples/basic_ecu_doip/boards/frdm_mcxn947/frdm_mcxn947_doip.conf" \
#       -DDTC_OVERLAY_FILE=boards/frdm_mcxn947/frdm_mcxn947.overlay
#   boards/frdm_mcxn947/frdm_mcxn947.{conf,overlay} give the watchdog, the flash
#   options and the diag_nvs partition (256 KB at 0x1C0000, append backend: the
#   128-byte write block is more than NVS takes, EDS#640).
#   -DDIAG_USE_MOCK_NVM=ON keeps the DTC mirror in RAM instead.
#
# RUN ON HARDWARE (FRDM-MCXN947 700-90818 A1, 2026-11-23): DoIP Pro campaign
# 8/8 before and after a reset, store on real flash, pings up to 1512-byte
# frames. Frames over 1512 bytes are dropped by the v3.7.0 driver (EDS#648).
# =============================================================================
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.10.10.1"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.10.10.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

# --- Random numbers for TCP: TEST GENERATOR, NOT FOR PRODUCTION --------------
# TCP needs sys_rand_get() (initial sequence numbers). The MCX N947 has a TRNG,
# but Zephyr v3.7.0's board devicetree has no node for it, so without this the
# link fails with "undefined reference to z_impl_sys_rand_get". The test
# generator makes TCP sequence numbers predictable: acceptable on a bench link,
# not in a product, which must supply a real entropy driver. EDS's own
# SecurityAccess seeds do not come from here (see uds_security_algo_set_rng_cb
# in src/main.c and docs/SECURITY_NOTICE.md).
CONFIG_TEST_RANDOM_GENERATOR=y

# --- One received frame must fit one net_buf [EDS#647] -----------------------
# Zephyr v3.7.0's eth_nxp_enet_qos_mac.c hands the RX DMA buffers of
# CONFIG_NET_BUF_DATA_SIZE bytes (line 447) but programs the DMA buffer size as
# NET_ETH_MAX_FRAME_SIZE (1514 here, written as 1514 >> 2 into RBSZ, so 1512
# bytes, line 471), and then adds the whole frame length to that one buffer
# (net_buf_add(buf, pkt_len), line 219). With the default of 128 any frame
# longer than 128 bytes (a DHCP offer, a 1000-byte ping, a long UDS request)
# trips the net_buf assert and panics the ENETQOS_RX thread; with asserts off
# the DMA would write past the buffer. Zephyr v4.4 splits a frame over several
# buffers and does not need this.
# 1536: at least the 1518-byte largest normal frame the MAC reports (1514 plus
# the 4-byte FCS, ENET_QOS_MAX_NORMAL_FRAME_LEN), so neither the DMA (1512) nor
# net_buf_add() can pass the end, rounded up to a multiple of 32 so every
# buffer in the pool stays 32-byte aligned for the DMA. Cost: the 36 RX + 36 TX
# buffers grow from 128 to 1536 bytes, about 99 KB more RAM (the build reports
# the total; 320 KB on this part).
CONFIG_NET_BUF_DATA_SIZE=1536
