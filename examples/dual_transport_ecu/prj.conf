# examples/dual_transport_ecu/prj.conf — [EDS#197] CAN + DoIP on the executor.
# basic_ecu's CAN settings and basic_ecu_doip's networking, together.

# --- CAN ---
CONFIG_CAN=y
CONFIG_CAN_INIT_PRIORITY=80

# --- Kernel ---
CONFIG_MULTITHREADING=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_TICKLESS_KERNEL=n
CONFIG_HEAP_MEM_POOL_SIZE=0

# --- Logging and checks ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ASSERT=y
CONFIG_STACK_CANARIES=y
CONFIG_EDS_REQUIRE_STACK_CANARIES=y

# --- Networking (DoIP over TCP, discovery over UDP) ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IF_MAX_IPV4_COUNT=1
CONFIG_NET_MAX_CONN=8
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=4096
CONFIG_ZVFS_OPEN_MAX=16

CONFIG_BUILD_OUTPUT_BIN=y
