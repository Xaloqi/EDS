# examples/dual_transport_ecu/fd.conf — CAN FD instead of classic CAN.
# Add after the board's conf in EXTRA_CONF_FILE. The controller runs in FD
# mode, ISO-TP builds its FD paths and src/main.c opens an FD channel
# (TX_DL 64, bit rate switch on). The board needs an FD controller.
CONFIG_CAN_FD_MODE=y
