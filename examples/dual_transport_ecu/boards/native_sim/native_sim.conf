# examples/dual_transport_ecu/boards/native_sim/native_sim.conf
# CAN: SocketCAN zcan0 (native_sim.overlay, as DTC_OVERLAY_FILE). DoIP: the native
# Ethernet on the TAP zeth, ECU 192.0.2.1/24, as basic_ecu_doip's
# native_sim_doip_realzeth.conf (NET_LOOPBACK off: it would hide the
# Ethernet driver and take the address). No watchdog, the RAM NVM mock.
CONFIG_NVS=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n
CONFIG_WATCHDOG=n

CONFIG_POSIX_API=y
# The TAP driver polls for frames every 50 ms by default, which would put
# 50 ms on every DoIP round trip (the latency check of
# scripts/smoke_dual_transport_ecu.py measures the ECU, not the simulation).
CONFIG_ETH_NATIVE_POSIX_RX_TIMEOUT=1
CONFIG_NET_LOOPBACK=n
CONFIG_NET_NATIVE=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DRIVERS=y
CONFIG_ETH_NATIVE_POSIX=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.1"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"

CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_NATIVE_POSIX=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_STACK_CANARIES=n
CONFIG_PICOLIBC=y
