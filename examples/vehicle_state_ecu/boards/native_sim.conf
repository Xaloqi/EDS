# =============================================================================
# Xaloqi EDS
# examples/vehicle_state_ecu/boards/native_sim.conf
#
# native_sim-specific Kconfig overrides, auto-merged by Zephyr CMake on top
# of prj.conf for this board only (Zephyr convention: <app>/boards/<BOARD>.conf
# is picked up automatically — this is why `west build -b native_sim
# examples/vehicle_state_ecu` is a single command with no extra flags).
#
# Identical to the root boards/native_sim/native_sim.conf (see that file for
# the full rationale behind each override — Zephyr 3.7 promotes Kconfig
# dependency warnings to fatal errors on native_sim for all of these).
# Duplicated here, not referenced, because this example ships no board
# target other than native_sim and keeps its own build self-contained.
# =============================================================================

CONFIG_CAN_LOOPBACK=y
CONFIG_POSIX_API=y
CONFIG_STACK_CANARIES=n
CONFIG_CAN_STATS=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_NATIVE_POSIX=y
# [#498] native_sim links picolibc, whatever is requested: on Zephyr 3.7 the
# Kconfig choice drops NEWLIB_LIBC=y for this board ("choice symbol NEWLIB_LIBC
# ... ended up as PICOLIBC"), with the host and the SDK toolchain alike. Say so
# explicitly. (The #498 guard exempts native_sim for this reason.)
CONFIG_PICOLIBC=y
CONFIG_REBOOT=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_WATCHDOG=n
