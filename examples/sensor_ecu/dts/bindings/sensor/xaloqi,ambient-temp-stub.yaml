description: |
  Xaloqi EDS example-only stub ambient temperature sensor.

  native_sim has no real temperature hardware. This binding backs a
  minimal out-of-tree driver (drivers/sensor_stub/ambient_temp_stub.c)
  that returns a fixed nominal reading so sensor_monitor.c's real Zephyr
  sensor API calls (sensor_sample_fetch/sensor_channel_get) have an
  actual struct device to resolve against on native_sim. On real
  hardware, replace this node with a physical sensor binding (see
  boards/native_sim/native_sim.overlay's header comment for examples) —
  this binding is not meant to be used outside this example.

compatible: "xaloqi,ambient-temp-stub"

include: sensor-device.yaml
