# examples/sensor_ecu/boards/native_sim/native_sim.conf
# native_sim-specific Kconfig overrides for the SensorECU example.

# Disable real NVS flash (not present on native_sim)
CONFIG_NVS=n
CONFIG_FLASH=n
CONFIG_FLASH_MAP=n

# Use loopback CAN
CONFIG_CAN_LOOPBACK=y

# Disable watchdog (not present on native_sim)
CONFIG_WATCHDOG=n

# Sensor stub drivers (native_sim simulation only) — see
# drivers/sensor_stub/ and boards/native_sim/native_sim.overlay [EDS#339]
CONFIG_SENSOR=y

# [EDS#339] zephyr_port_ecu_reset() calls sys_reboot(), undefined on
# native_sim without this -- a separate link-time gap found alongside the
# missing sensor driver (same issue, confirmed on EDS#339's comment thread).
CONFIG_REBOOT=y
